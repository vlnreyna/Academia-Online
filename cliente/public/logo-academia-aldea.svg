<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="plata" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d9199"/>
      <stop offset="0.35" stop-color="#eef0f2"/>
      <stop offset="0.55" stop-color="#9da1a8"/>
      <stop offset="0.8" stop-color="#eef0f2"/>
      <stop offset="1" stop-color="#b4b8be"/>
    </linearGradient>
    <linearGradient id="tarjeta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0f16"/>
      <stop offset="0.58" stop-color="#0b0f16"/>
      <stop offset="0.88" stop-color="#0f2a44"/>
      <stop offset="1" stop-color="#2b6a8e"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="1" r="0.7">
      <stop offset="0" stop-color="#2b6a8e" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#2b6a8e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="18" fill="url(#tarjeta)" stroke="#c7cad0" stroke-opacity="0.2" stroke-width="2"/>
  <rect x="24" y="24" width="464" height="464" rx="18" fill="url(#halo)"/>
  <rect x="24" y="24" width="464" height="6" rx="3" fill="url(#plata)"/>
  <!-- Monograma A A -->
  <text x="256" y="250" text-anchor="middle" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="150" letter-spacing="10" fill="url(#plata)">AA</text>
  <!-- Barra plateada, motivo del logo de la web -->
  <rect x="156" y="290" width="200" height="12" rx="1" fill="url(#plata)"/>
  <text x="256" y="368" text-anchor="middle" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="40" letter-spacing="14" fill="#eef0f2">ALDEA</text>
</svg>
